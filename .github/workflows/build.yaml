name: build
on: push
jobs:
  build:
    # push, or pull_request from fork
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 25
          architecture: x64
          distribution: adopt
          cache: maven
      # No --update-snapshots: nothing in the effective POM is a SNAPSHOT (the matsim parent is a pinned release),
      # so it has nothing to update, and it forces every repository to be re-asked for metadata and for artifacts
      # whose absence is already cached -- including the slow ones. Add it back when pinning a SNAPSHOT parent.
      - run: mvn --batch-mode package checkstyle:checkstyle enforcer:enforce -Dmatsim.preferLocalDtds=true -Dmaven.javadoc.skip -e
      - run: mkdir staging && cp *.jar staging
      - uses: actions/upload-artifact@v4
        with:
          name: Package
          path: staging
    env:
      # Bound how long a single unresponsive repository can hold up resolution. jogamp.org (inherited from
      # matsim-all, serves nothing we use) answers each request only after ~45s, which on a cold cache cost
      # roughly an hour per job before central was moved to the front of the repository list in pom.xml.
      # Set for both the default resolver transport and wagon, whichever ends up being used.
      MAVEN_OPTS: >-
        -Xmx512m
        -Daether.connector.connectTimeout=5000
        -Daether.connector.requestTimeout=30000
        -Dmaven.wagon.http.connectionTimeout=5000
        -Dmaven.wagon.http.readTimeout=30000